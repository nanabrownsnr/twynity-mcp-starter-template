# Builds and deploys the development branch through Twynity's Kubernetes flow.
# Replace image, GitOps repository, values key, and secret names for your MCP.
name: Build and Deploy to K8s Development

on:
  push:
    branches:
      - dev
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  build_and_deploy:
    environment: development
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: "0"

      - name: Create GitHub Envs
        run: |
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_ACR_REGISTRY }}
          username: ${{ secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Build and push image to Azure Container Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Put your MCP image repository name here.
          tags: ${{ secrets.AZURE_ACR_REGISTRY }}/mcp-server-dev:${{ env.SHORT_SHA }}

      # Update GitOps repo with retries
      - name: Update GitOps repo (development branch)
        run: |
          set +e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          for i in {1..25}; do
            rm -rf gitops
            git clone https://x-access-token:${{ secrets.GITOPS_PAT }}@github.com/4th-ir/twynity-scripts.git gitops
            if [ $? -ne 0 ]; then
              echo "Clone failed, retrying..."
              sleep 5
              continue
            fi
            cd gitops
            git checkout development
            git pull --rebase origin development
            # Replace `your_mcp` with this MCP's key in the GitOps values file.
            yq eval '.mcps.your_mcp.image.tag = "${{ env.SHORT_SHA }}"' -i twynity-installation/charts/mcps/values.yaml
            git add twynity-installation/charts/mcps/values.yaml
            git commit -m "🧪 Deploy MCP to development: ${{ env.SHORT_SHA }}"
            git push origin development
            if [ $? -eq 0 ]; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            echo "Push failed, retrying in 5 seconds..."
            cd ..
            sleep 5
          done
          exit 1
